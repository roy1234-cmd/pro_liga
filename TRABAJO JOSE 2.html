<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ferretería El Constructor</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            width: 800px;
            max-width: 95%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #999;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            color: #444;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 10px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #ca6f1e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .eliminar {
            background-color: #c0392b;
        }

        .eliminar:hover {
            background-color: #922b21;
        }

    </style>

</head>


<body>

    <div class="contenedor">

        <h1>🔨 Ferretería El Constructor</h1>

        <h2>Registrar producto</h2>

        <form id="formulario">

            <label>
                Nombre del producto
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ejemplo: Martillo"
                required
            >


            <label>
                Categoría
            </label>

            <select id="categoria" required>

                <option value="">
                    Seleccione una categoría
                </option>

                <option value="Herramientas">
                    Herramientas
                </option>

                <option value="Materiales">
                    Materiales
                </option>

                <option value="Tornillería">
                    Tornillería
                </option>

                <option value="Electricidad">
                    Electricidad
                </option>

            </select>


            <label>
                Precio
            </label>

            <input
                type="number"
                id="precio"
                placeholder="Ejemplo: 25.50"
                step="0.01"
                required
            >


            <button type="submit">
                Registrar producto
            </button>

        </form>


        <h2>Productos registrados</h2>


        <table>

            <thead>

                <tr>

                    <th>
                        Producto
                    </th>

                    <th>
                        Categoría
                    </th>

                    <th>
                        Precio
                    </th>

                    <th>
                        Acción
                    </th>

                </tr>

            </thead>


            <tbody id="listaProductos">

                <tr>

                    <td>
                        Martillo
                    </td>

                    <td>
                        Herramientas
                    </td>

                    <td>
                        S/ 25.00
                    </td>

                    <td>

                        <button
                            class="eliminar"
                            onclick="eliminar(this)"
                        >
                            Eliminar
                        </button>

                    </td>

                </tr>


                <tr>

                    <td>
                        Destornillador
                    </td>

                    <td>
                        Herramientas
                    </td>

                    <td>
                        S/ 12.00
                    </td>

                    <td>

                        <button
                            class="eliminar"
                            onclick="eliminar(this)"
                        >
                            Eliminar
                        </button>

                    </td>

                </tr>


                <tr>

                    <td>
                        Tornillos
                    </td>

                    <td>
                        Tornillería
                    </td>

                    <td>
                        S/ 8.50
                    </td>

                    <td>

                        <button
                            class="eliminar"
                            onclick="eliminar(this)"
                        >
                            Eliminar
                        </button>

                    </td>

                </tr>


                <tr>

                    <td>
                        Cinta métrica
                    </td>

                    <td>
                        Herramientas
                    </td>

                    <td>
                        S/ 18.00
                    </td>

                    <td>

                        <button
                            class="eliminar"
                            onclick="eliminar(this)"
                        >
                            Eliminar
                        </button>

                    </td>

                </tr>


                <tr>

                    <td>
                        Llave inglesa
                    </td>

                    <td>
                        Herramientas
                    </td>

                    <td>
                        S/ 30.00
                    </td>

                    <td>

                        <button
                            class="eliminar"
                            onclick="eliminar(this)"
                        >
                            Eliminar
                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <script>

        const formulario =
            document.getElementById("formulario");


        formulario.addEventListener(
            "submit",
            function(evento) {

                evento.preventDefault();


                const nombre =
                    document.getElementById("nombre").value;

                const categoria =
                    document.getElementById("categoria").value;

                const precio =
                    document.getElementById("precio").value;


                const tabla =
                    document.getElementById("listaProductos");


                const fila =
                    document.createElement("tr");


                fila.innerHTML = `

                    <td>${nombre}</td>

                    <td>${categoria}</td>

                    <td>S/ ${parseFloat(precio).toFixed(2)}</td>

                    <td>

                        <button
                            class="eliminar"
                            onclick="eliminar(this)"
                        >
                            Eliminar
                        </button>

                    </td>

                `;


                tabla.appendChild(fila);


                formulario.reset();

            }
        );


        function eliminar(boton) {

            boton.parentElement.parentElement.remove();

        }

    </script>

</body>

</html>S
